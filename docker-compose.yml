version: "3.9"

services:
  # ── FastAPI application ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hybrid-rag-gateway:latest
    container_name: hybrid-rag-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Uncomment to enable Redis integration when the redis service below is active:
    # depends_on:
    #   redis:
    #     condition: service_healthy

  # ── Optional Redis backend for semantic cache ─────────────────────────────
  # Uncomment this service to use Redis for persistent semantic caching.
  # When enabled, update backend/cache.py to use redis-py with RediSearch.
