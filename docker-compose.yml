  #   image: redis/redis-stack:7.2.0-v9
  #   container_name: hybrid-rag-redis
  #   ports:
  #     - "6379:6379"
  #     - "8001:8001"          # RedisInsight UI
  #   volumes:
  #     - redis_data:/data
  #   command: >
  #     redis-stack-server
  #     --save 60 1
  #     --loglevel warning
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
